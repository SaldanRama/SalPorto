      <text x="15" y="30" fill="#34D399" font-family="sans-serif" font-size="12" font-weight="700">STEP 3: SELESAI</text>
      <text x="15" y="55" fill="#A1A1AA" font-family="sans-serif" font-size="12">Unduh Bukti</text>
      <text x="15" y="75" fill="#34D399" font-family="sans-serif" font-size="11">Tracking Status QR</text>
    </g>
