<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="figmaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#27272A"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#figmaBg)"/>

  <rect x="50" y="45" width="700" height="60" rx="14" fill="#27272A" stroke="#3F3F46" stroke-width="1.5"/>
  <text x="80" y="80" fill="#FAFAFA" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">FIGMA DESIGN SYSTEM &amp; ATOMIC COMPONENTS</text>
  <rect x="625" y="60" width="105" height="30" rx="15" fill="#A855F7"/>
  <text x="677" y="79" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">UI SYSTEM</text>

  <rect x="50" y="125" width="700" height="425" rx="16" fill="#121215" stroke="#3F3F46" stroke-width="1.5"/>

  <g transform="translate(80, 155)">
    <rect width="305" height="175" rx="12" fill="#27272A" stroke="#3F3F46" stroke-width="1"/>
    <text x="20" y="35" fill="#E4E4E7" font-family="sans-serif" font-size="14" font-weight="700">Button Variants / States</text>
    
    <rect x="20" y="55" width="125" height="36" rx="8" fill="#0284C7"/>
    <text x="82" y="78" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Primary Solid</text>

    <rect x="160" y="55" width="125" height="36" rx="8" fill="transparent" stroke="#0284C7" stroke-width="1.5"/>
    <text x="222" y="78" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Secondary Outline</text>

    <rect x="20" y="110" width="125" height="36" rx="8" fill="#3F3F46"/>
    <text x="82" y="133" fill="#A1A1AA" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Disabled</text>

    <rect x="160" y="110" width="125" height="36" rx="18" fill="#0284C7" opacity="0.2"/>
    <text x="222" y="133" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Pill Badge</text>
  </g>

  <g transform="translate(415, 155)">
    <rect width="305" height="175" rx="12" fill="#27272A" stroke="#3F3F46" stroke-width="1"/>
    <text x="20" y="35" fill="#E4E4E7" font-family="sans-serif" font-size="14" font-weight="700">Color System &amp; Tokens</text>
    
    <circle cx="45" cy="80" r="20" fill="#0284C7"/>
    <text x="75" y="85" fill="#FFFFFF" font-family="monospace" font-size="12">#0284C7 Primary</text>

    <circle cx="45" cy="135" r="20" fill="#10B981"/>
    <text x="75" y="140" fill="#FFFFFF" font-family="monospace" font-size="12">#10B981 Success</text>

    <circle cx="185" cy="80" r="20" fill="#F59E0B"/>
    <text x="215" y="85" fill="#FFFFFF" font-family="monospace" font-size="12">#F59E0B Alert</text>

    <circle cx="185" cy="135" r="20" fill="#6366F1"/>
    <text x="215" y="140" fill="#FFFFFF" font-family="monospace" font-size="12">#6366F1 Accent</text>
