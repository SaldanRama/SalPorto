      <text x="15" y="55" fill="#A1A1AA" font-family="sans-serif" font-size="12">Pilih Jenis Layanan</text>
      <text x="15" y="75" fill="#71717A" font-family="sans-serif" font-size="11">SKTM / Domisili / Usaha</text>
    </g>

    <path d="M 205 105 L 235 105" stroke="#38BDF8" stroke-width="2"/>
    <polygon points="235,100 245,105 235,110" fill="#38BDF8"/>

