      <text x="15" y="55" fill="#A1A1AA" font-family="sans-serif" font-size="12">Isi Data &amp; Dokumen</text>
      <text x="15" y="75" fill="#71717A" font-family="sans-serif" font-size="11">Verifikasi NIK Otomatis</text>
    </g>

    <path d="M 435 105 L 465 105" stroke="#38BDF8" stroke-width="2"/>
