<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="50%" stop-color="#1A2238"/>
      <stop offset="100%" stop-color="#0F131D"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232B42"/>
      <stop offset="100%" stop-color="#171C2C"/>
    </linearGradient>
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad1)"/>
  <circle cx="700" cy="100" r="260" fill="#6366F1" opacity="0.08" filter="blur(60px)"/>
  <circle cx="100" cy="500" r="220" fill="#3B82F6" opacity="0.07" filter="blur(50px)"/>

  <!-- Top bar -->
  <rect x="50" y="45" width="700" height="60" rx="14" fill="#1C2337" stroke="#2E3852" stroke-width="1.5"/>
  <circle cx="85" cy="75" r="7" fill="#EF4444"/>
  <circle cx="108" cy="75" r="7" fill="#F59E0B"/>
  <circle cx="131" cy="75" r="7" fill="#10B981"/>
  <text x="165" y="80" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" letter-spacing="0.05em">WEB-LAB-SESSION / PRACTICUM 01 — FULL-STACK</text>
  <rect x="610" y="60" width="120" height="30" rx="15" fill="#2E3852"/>
  <text x="670" y="79" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">ACTIVE LAB</text>

  <!-- Code editor canvas -->
  <rect x="50" y="125" width="460" height="425" rx="16" fill="url(#cardGrad1)" stroke="#2E3852" stroke-width="1.5"/>
  
  <!-- Line numbers and code -->
  <g font-family="'Fira Code', 'Courier New', monospace" font-size="14" line-height="24">
    <text x="80" y="170" fill="#64748B">01</text>
    <text x="115" y="170" fill="#F43F5E">import</text>
    <text x="175" y="170" fill="#E2E8F0">{ useState, useEffect }</text>
    <text x="355" y="170" fill="#F43F5E">from</text>
    <text x="395" y="170" fill="#38BDF8">'react'</text>

    <text x="80" y="205" fill="#64748B">02</text>
    <text x="115" y="205" fill="#64748B">// Lab Exercise: Dynamic DOM &amp; State Binding</text>

    <text x="80" y="240" fill="#64748B">03</text>
    <text x="115" y="240" fill="#818CF8">export function</text>
    <text x="235" y="240" fill="#FBBF24">StudentPortal</text>
    <text x="345" y="240" fill="#E2E8F0">() {</text>

    <text x="80" y="275" fill="#64748B">04</text>
    <text x="135" y="275" fill="#818CF8">const</text>
    <text x="180" y="275" fill="#E2E8F0">[modules, setModules] =</text>
    <text x="365" y="275" fill="#38BDF8">useState</text>
    <text x="430" y="275" fill="#E2E8F0">([])</text>

    <text x="80" y="310" fill="#64748B">05</text>
    <text x="135" y="310" fill="#818CF8">const</text>
    <text x="180" y="310" fill="#E2E8F0">[gradingStatus] =</text>
    <text x="315" y="310" fill="#34D399">'APPROVED'</text>

    <text x="80" y="345" fill="#64748B">06</text>
    <text x="135" y="345" fill="#F43F5E">return</text>
    <text x="190" y="345" fill="#E2E8F0">(</text>

    <text x="80" y="380" fill="#64748B">07</text>
    <text x="155" y="380" fill="#38BDF8">&lt;LaboratorySandbox</text>
    <text x="320" y="380" fill="#FBBF24">role</text>
    <text x="350" y="380" fill="#E2E8F0">=</text>
    <text x="360" y="380" fill="#34D399">"Assistant"</text>
    <text x="445" y="380" fill="#38BDF8">&gt;</text>

    <text x="80" y="415" fill="#64748B">08</text>
    <text x="175" y="415" fill="#38BDF8">&lt;ModuleTracker</text>
    <text x="305" y="415" fill="#FBBF24">cohort</text>
    <text x="360" y="415" fill="#E2E8F0">=</text>
    <text x="370" y="415" fill="#34D399">"2023/2024"</text>
    <text x="460" y="415" fill="#38BDF8">/&gt;</text>

    <text x="80" y="450" fill="#64748B">09</text>
    <text x="155" y="450" fill="#38BDF8">&lt;/LaboratorySandbox&gt;</text>

    <text x="80" y="485" fill="#64748B">10</text>
    <text x="115" y="485" fill="#E2E8F0">}</text>
  </g>

  <!-- Right Side Visual Cards -->
  <g transform="translate(530, 125)">
    <!-- Lab Stats Card -->
    <rect width="220" height="195" rx="16" fill="url(#cardGrad1)" stroke="#2E3852" stroke-width="1.5"/>
    <rect x="20" y="20" width="36" height="36" rx="10" fill="#6366F1" opacity="0.2"/>
    <path d="M 38 28 L 38 48 M 28 38 L 48 38" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round"/>
    <text x="20" y="90" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="0.05em">COHORT CAPACITY</text>
    <text x="20" y="125" fill="#FFFFFF" font-family="sans-serif" font-size="28" font-weight="700">100+ Students</text>
    <text x="20" y="155" fill="#34D399" font-family="sans-serif" font-size="13" font-weight="600">✓ Web Dev &amp; Architecture</text>
    <rect x="20" y="172" width="180" height="4" rx="2" fill="#2E3852"/>
    <rect x="20" y="172" width="145" height="4" rx="2" fill="url(#accentGrad1)"/>

    <!-- Practical Session Details -->
    <rect y="215" width="220" height="210" rx="16" fill="url(#cardGrad1)" stroke="#2E3852" stroke-width="1.5"/>
    <text x="20" y="245" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="0.05em">LAB ENVIRONMENT</text>
    <text x="20" y="275" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="700">Unhas Web Lab</text>
    <rect x="20" y="295" width="180" height="1" fill="#2E3852"/>
    <text x="20" y="325" fill="#CBD5E1" font-family="sans-serif" font-size="13">• Hands-on Mentoring</text>
    <text x="20" y="355" fill="#CBD5E1" font-family="sans-serif" font-size="13">• Curriculum Moduling</text>
    <text x="20" y="385" fill="#CBD5E1" font-family="sans-serif" font-size="13">• Final Project Reviews</text>
  </g>
</svg>
