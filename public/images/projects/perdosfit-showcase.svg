<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="pfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D14"/>
      <stop offset="50%" stop-color="#0E1624"/>
      <stop offset="100%" stop-color="#141E30"/>
    </linearGradient>

    <linearGradient id="pfEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="pfIndigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <linearGradient id="pfAccentMesh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.04"/>
    </linearGradient>

    <filter id="pfDropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="pfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70" result="blur"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1600" height="1000" fill="url(#pfBg)"/>

  <!-- Ambient Light Accents -->
  <circle cx="300" cy="200" r="300" fill="#10B981" opacity="0.16" filter="url(#pfGlow)"/>
  <circle cx="1300" cy="350" r="350" fill="#6366F1" opacity="0.16" filter="url(#pfGlow)"/>
  <circle cx="800" cy="850" r="300" fill="#059669" opacity="0.12" filter="url(#pfGlow)"/>

  <!-- Top Showcase Branding Header -->
  <g transform="translate(100, 80)">
    <!-- Brand Icon -->
    <rect width="48" height="48" rx="14" fill="url(#pfEmeraldGrad)"/>
    <path d="M16 28 L24 18 L32 28 M20 25 L28 25" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="65" y="32" fill="#FFFFFF" font-family="'DM Sans', sans-serif" font-size="28" font-weight="800" letter-spacing="-0.02em">
      PerdosFit
    </text>
    <text x="220" y="32" fill="#34D399" font-family="'DM Sans', sans-serif" font-size="16" font-weight="600">
      • Gym Management &amp; Double Diamond Case Study
    </text>
    <text x="65" y="58" fill="#94A3B8" font-family="'DM Sans', sans-serif" font-size="14" font-weight="500">
      Multi-Role Web System for Administrators, Certified Personal Trainers, and Fitness Members
    </text>
  </g>

  <!-- MAIN MOCKUP WINDOW -->
  <g transform="translate(100, 170)" filter="url(#pfDropShadow)">
    <rect width="1400" height="740" rx="20" fill="#0C101A" stroke="#1E293B" stroke-width="2"/>

    <!-- Window Top Header -->
    <rect width="1400" height="54" rx="20" fill="#131826"/>
    <circle cx="32" cy="27" r="7" fill="#EF4444"/>
    <circle cx="56" cy="27" r="7" fill="#F59E0B"/>
    <circle cx="80" cy="27" r="7" fill="#10B981"/>

    <rect x="140" y="11" width="550" height="32" rx="8" fill="#0C101A" stroke="#1E293B"/>
    <text x="160" y="32" fill="#64748B" font-family="monospace" font-size="12">https://app.perdosfit.id/admin/member-management</text>

    <!-- Sidebar Simulation -->
    <g transform="translate(24, 75)">
      <rect width="220" height="635" rx="14" fill="#111624" stroke="#1E2638"/>
      <!-- Nav items -->
      <g transform="translate(18, 25)">
        <!-- Active Nav -->
        <rect width="184" height="40" rx="10" fill="#10B981" opacity="0.15"/>
        <text x="15" y="25" fill="#34D399" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700">Dashboard Overview</text>

        <text x="15" y="75" fill="#94A3B8" font-family="'DM Sans', sans-serif" font-size="13" font-weight="500">Member Directory</text>
        <text x="15" y="120" fill="#94A3B8" font-family="'DM Sans', sans-serif" font-size="13" font-weight="500">Trainer Schedules</text>
        <text x="15" y="165" fill="#94A3B8" font-family="'DM Sans', sans-serif" font-size="13" font-weight="500">Billing &amp; Subscriptions</text>
        <text x="15" y="210" fill="#94A3B8" font-family="'DM Sans', sans-serif" font-size="13" font-weight="500">Locker &amp; Equipment</text>
        <text x="15" y="255" fill="#94A3B8" font-family="'DM Sans', sans-serif" font-size="13" font-weight="500">Analytics &amp; Revenue</text>

        <!-- Divider -->
        <line x1="0" y1="300" x2="184" y2="300" stroke="#1E2638"/>
        <text x="15" y="340" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="700">DOUBLE DIAMOND</text>
        <text x="15" y="370" fill="#94A3B8" font-family="sans-serif" font-size="12">1. Discover</text>
        <text x="15" y="405" fill="#94A3B8" font-family="sans-serif" font-size="12">2. Define</text>
        <text x="15" y="440" fill="#34D399" font-family="sans-serif" font-size="12" font-weight="700">3. Develop</text>
        <text x="15" y="475" fill="#94A3B8" font-family="sans-serif" font-size="12">4. Deliver</text>
      </g>
    </g>

    <!-- Main Content Area -->
    <g transform="translate(265, 75)">
      <!-- Top Bar Inside App -->
      <text x="0" y="28" fill="#FFFFFF" font-family="'DM Sans', sans-serif" font-size="22" font-weight="800">
        Perdos Gym Club • Performance Analytics
      </text>
      <text x="0" y="52" fill="#94A3B8" font-family="'DM Sans', sans-serif" font-size="13">
        Real-time monitoring of active gym check-ins, personal trainer appointments, and retention.
      </text>

      <!-- Quick Action Buttons -->
      <rect x="910" y="10" width="95" height="38" rx="10" fill="#1E293B"/>
      <text x="957" y="34" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Export Data</text>

      <rect x="1018" y="10" width="100" height="38" rx="10" fill="#10B981"/>
      <text x="1068" y="34" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">+ Add Member</text>

      <!-- KPI METRIC CARDS -->
      <g transform="translate(0, 80)">
        <!-- Card 1 -->
        <rect width="260" height="110" rx="14" fill="#111724" stroke="#1E293B" stroke-width="1.5"/>
        <text x="20" y="32" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="700">ACTIVE GYM MEMBERS</text>
        <text x="20" y="72" fill="#FFFFFF" font-family="'DM Sans', sans-serif" font-size="30" font-weight="800">1,480</text>
        <text x="120" y="70" fill="#34D399" font-family="sans-serif" font-size="12" font-weight="700">▲ +14.2%</text>
        <text x="20" y="94" fill="#64748B" font-family="sans-serif" font-size="11">Monthly Recurring Subscriptions</text>

        <!-- Card 2 -->
        <g transform="translate(280, 0)">
          <rect width="260" height="110" rx="14" fill="#111724" stroke="#1E293B" stroke-width="1.5"/>
          <text x="20" y="32" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="700">TODAY'S CHECK-INS</text>
          <text x="20" y="72" fill="#34D399" font-family="'DM Sans', sans-serif" font-size="30" font-weight="800">248</text>
          <text x="95" y="70" fill="#94A3B8" font-family="sans-serif" font-size="12">Peak at 18:30</text>
          <text x="20" y="94" fill="#64748B" font-family="sans-serif" font-size="11">QR Turnstile Gate Access</text>
        </g>

        <!-- Card 3 -->
        <g transform="translate(560, 0)">
          <rect width="260" height="110" rx="14" fill="#111724" stroke="#1E293B" stroke-width="1.5"/>
          <text x="20" y="32" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="700">PT SESSIONS BOOKED</text>
          <text x="20" y="72" fill="#818CF8" font-family="'DM Sans', sans-serif" font-size="30" font-weight="800">42</text>
          <text x="75" y="70" fill="#34D399" font-family="sans-serif" font-size="12">92% Attendance</text>
          <text x="20" y="94" fill="#64748B" font-family="sans-serif" font-size="11">12 Dedicated Personal Trainers</text>
        </g>

        <!-- Card 4 -->
        <g transform="translate(840, 0)">
          <rect width="278" height="110" rx="14" fill="#111724" stroke="#1E293B" stroke-width="1.5"/>
          <text x="20" y="32" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="700">RETENTION RATE</text>
          <text x="20" y="72" fill="#FBBF24" font-family="'DM Sans', sans-serif" font-size="30" font-weight="800">89.4%</text>
          <text x="20" y="94" fill="#64748B" font-family="sans-serif" font-size="11">Double Diamond UX optimization</text>
        </g>
      </g>

      <!-- VISUAL WORKOUT PROGRESS CHART & TRAINER ROSTER -->
      <g transform="translate(0, 215)">
        <!-- Chart: Hourly Peak Gym Activity -->
        <rect width="680" height="415" rx="16" fill="#0E1422" stroke="#1E293B" stroke-width="1.5"/>
        <text x="28" y="36" fill="#F8FAFC" font-family="'DM Sans', sans-serif" font-size="16" font-weight="700">
          Gym Floor Density by Hour (Double Diamond Finding)
        </text>
        <text x="28" y="58" fill="#64748B" font-family="sans-serif" font-size="12">
          Solved congestion in free weights area by staggering group classes and trainer slots
        </text>

        <!-- Chart Grid Lines -->
        <g transform="translate(28, 90)">
          <!-- Area Curve -->
          <path d="M 0 240 Q 120 220, 240 180 T 480 80 T 620 160 L 620 260 L 0 260 Z" fill="url(#pfAccentMesh)"/>
          <path d="M 0 240 Q 120 220, 240 180 T 480 80 T 620 160" stroke="#10B981" stroke-width="3.5" fill="none"/>
          <circle cx="480" cy="80" r="7" fill="#10B981" stroke="#0C101A" stroke-width="3"/>
          <text x="480" y="60" fill="#34D399" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Peak 18:30 (88%)</text>

          <!-- Timeline labels -->
          <text x="10" y="285" fill="#64748B" font-family="sans-serif" font-size="11">06:00</text>
          <text x="150" y="285" fill="#64748B" font-family="sans-serif" font-size="11">10:00</text>
          <text x="300" y="285" fill="#64748B" font-family="sans-serif" font-size="11">14:00</text>
          <text x="460" y="285" fill="#64748B" font-family="sans-serif" font-size="11">18:00</text>
          <text x="590" y="285" fill="#64748B" font-family="sans-serif" font-size="11">22:00</text>
        </g>

        <!-- Right Side: Personal Trainer Schedule Cards -->
        <g transform="translate(705, 0)">
          <rect width="413" height="415" rx="16" fill="#0E1422" stroke="#1E293B" stroke-width="1.5"/>
          <text x="24" y="36" fill="#F8FAFC" font-family="'DM Sans', sans-serif" font-size="16" font-weight="700">
            Certified Trainers on Duty
          </text>
          <text x="24" y="58" fill="#64748B" font-family="sans-serif" font-size="12">
            Schedule &amp; Client Capacity
          </text>

          <!-- Trainer Item 1 -->
          <g transform="translate(24, 85)">
            <rect width="365" height="74" rx="12" fill="#141B2D" stroke="#1E293B"/>
            <circle cx="36" cy="37" r="20" fill="#10B981" opacity="0.2"/>
            <text x="36" y="43" fill="#34D399" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">AK</text>
            <text x="70" y="32" fill="#FFFFFF" font-family="'DM Sans', sans-serif" font-size="14" font-weight="700">Andi Kurniawan, CSCS</text>
            <text x="70" y="52" fill="#94A3B8" font-family="sans-serif" font-size="12">Strength &amp; Hypertrophy • 5/6 Sessions</text>
            <rect x="295" y="24" width="55" height="26" rx="13" fill="#10B981" opacity="0.2"/>
            <text x="322" y="41" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Active</text>
          </g>

          <!-- Trainer Item 2 -->
          <g transform="translate(24, 175)">
            <rect width="365" height="74" rx="12" fill="#141B2D" stroke="#1E293B"/>
            <circle cx="36" cy="37" r="20" fill="#6366F1" opacity="0.2"/>
            <text x="36" y="43" fill="#818CF8" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">SR</text>
            <text x="70" y="32" fill="#FFFFFF" font-family="'DM Sans', sans-serif" font-size="14" font-weight="700">Siti Rahmadani</text>
            <text x="70" y="52" fill="#94A3B8" font-family="sans-serif" font-size="12">Mobility &amp; Functional Pilates • 4/4 Full</text>
            <rect x="295" y="24" width="55" height="26" rx="13" fill="#EF4444" opacity="0.2"/>
            <text x="322" y="41" fill="#F87171" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Booked</text>
          </g>

          <!-- Trainer Item 3 -->
          <g transform="translate(24, 265)">
            <rect width="365" height="74" rx="12" fill="#141B2D" stroke="#1E293B"/>
            <circle cx="36" cy="37" r="20" fill="#F59E0B" opacity="0.2"/>
            <text x="36" y="43" fill="#FBBF24" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">DW</text>
            <text x="70" y="32" fill="#FFFFFF" font-family="'DM Sans', sans-serif" font-size="14" font-weight="700">Dimas Wahyudi</text>
            <text x="70" y="52" fill="#94A3B8" font-family="sans-serif" font-size="12">Powerlifting &amp; Nutrition • 3/5 Sessions</text>
            <rect x="295" y="24" width="55" height="26" rx="13" fill="#10B981" opacity="0.2"/>
            <text x="322" y="41" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Active</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
