<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="kcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C18"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="kcCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="kcBlueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="kcAccentMesh" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="kcDropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <filter id="kcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1600" height="1000" fill="url(#kcBg)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="350" cy="250" r="320" fill="#0284C7" opacity="0.18" filter="url(#kcGlow)"/>
  <circle cx="1250" cy="400" r="380" fill="#38BDF8" opacity="0.14" filter="url(#kcGlow)"/>
  <circle cx="800" cy="850" r="280" fill="#0369A1" opacity="0.12" filter="url(#kcGlow)"/>

  <!-- Subtle Blueprint Grid Pattern -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="100" x2="1600" y2="100"/>
    <line x1="0" y1="200" x2="1600" y2="200"/>
    <line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="0" y1="400" x2="1600" y2="400"/>
    <line x1="0" y1="500" x2="1600" y2="500"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="700" x2="1600" y2="700"/>
    <line x1="0" y1="800" x2="1600" y2="800"/>
    <line x1="0" y1="900" x2="1600" y2="900"/>

    <line x1="200" y1="0" x2="200" y2="1000"/>
    <line x1="400" y1="0" x2="400" y2="1000"/>
    <line x1="600" y1="0" x2="600" y2="1000"/>
    <line x1="800" y1="0" x2="800" y2="1000"/>
    <line x1="1000" y1="0" x2="1000" y2="1000"/>
    <line x1="1200" y1="0" x2="1200" y2="1000"/>
    <line x1="1400" y1="0" x2="1400" y2="1000"/>
  </g>

  <!-- TOP BRANDING HEADER IN SHOWCASE -->
  <g transform="translate(100, 80)">
    <rect width="48" height="48" rx="14" fill="#0284C7"/>
    <path d="M16 24h16M24 16v16" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <text x="65" y="32" fill="#FFFFFF" font-family="'DM Sans', sans-serif" font-size="28" font-weight="800" letter-spacing="-0.02em">
      Kelurahan Cantik
    </text>
    <text x="315" y="32" fill="#38BDF8" font-family="'DM Sans', sans-serif" font-size="16" font-weight="600">
      • Diskominfo Kota Makassar
    </text>
    <text x="65" y="58" fill="#94A3B8" font-family="'DM Sans', sans-serif" font-size="14" font-weight="500">
      Portal Terintegrasi Statistik Desa/Kelurahan Cinta Statistik &amp; Pelayanan Publik Berbasis Data
    </text>
  </g>

  <!-- MAIN BROWSER / DASHBOARD WINDOW MOCKUP (Central Showcase) -->
  <g transform="translate(100, 170)" filter="url(#kcDropShadow)">
    <!-- Browser Frame -->
    <rect width="1400" height="740" rx="20" fill="#0B1120" stroke="#1E293B" stroke-width="2"/>

    <!-- Browser Window Header Bar -->
    <rect width="1400" height="54" rx="20" fill="#131C31"/>
    <!-- Window Controls -->
    <circle cx="32" cy="27" r="7" fill="#EF4444"/>
    <circle cx="56" cy="27" r="7" fill="#F59E0B"/>
    <circle cx="80" cy="27" r="7" fill="#10B981"/>

    <!-- URL Bar -->
    <rect x="140" y="11" width="600" height="32" rx="8" fill="#0B1120" stroke="#1E293B" stroke-width="1"/>
    <text x="160" y="32" fill="#64748B" font-family="monospace" font-size="12">https://kelurahancantik.makassarkota.go.id/dashboard/statistik</text>

    <!-- Top Portal Nav -->
    <g transform="translate(30, 75)">
      <text x="0" y="24" fill="#F8FAFC" font-family="'DM Sans', sans-serif" font-size="18" font-weight="700">DASHBOARD DEMOGRAFI &amp; LAYANAN WARGA</text>
      <text x="0" y="44" fill="#94A3B8" font-family="'DM Sans', sans-serif" font-size="12">Kecamatan Mamajang — Kelurahan Maricaya Selatan</text>

      <!-- Filter Buttons -->
      <rect x="1100" y="5" width="110" height="36" rx="8" fill="#1E293B" stroke="#334155"/>
      <text x="1155" y="28" fill="#F1F5F9" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Tahun 2024</text>
      <rect x="1225" y="5" width="115" height="36" rx="8" fill="#0284C7"/>
      <text x="1282" y="28" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Unduh Rekap</text>
    </g>

    <!-- STATS METRIC TILES ROW -->
    <g transform="translate(30, 145)">
      <!-- Tile 1 -->
      <rect width="320" height="110" rx="14" fill="#131D33" stroke="#1E293B" stroke-width="1.5"/>
      <text x="24" y="34" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="0.05em">TOTAL PENDUDUK TERCATAT</text>
      <text x="24" y="72" fill="#FFFFFF" font-family="'DM Sans', sans-serif" font-size="28" font-weight="800">18,492</text>
      <text x="135" y="70" fill="#34D399" font-family="sans-serif" font-size="13" font-weight="600">▲ +3.8%</text>
      <text x="24" y="94" fill="#64748B" font-family="sans-serif" font-size="11">Terverifikasi Dukcapil &amp; BPS Makassar</text>

      <!-- Tile 2 -->
      <g transform="translate(345, 0)">
        <rect width="320" height="110" rx="14" fill="#131D33" stroke="#1E293B" stroke-width="1.5"/>
        <text x="24" y="34" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="0.05em">KEPALA KELUARGA (KK)</text>
        <text x="24" y="72" fill="#FFFFFF" font-family="'DM Sans', sans-serif" font-size="28" font-weight="800">5,120</text>
        <text x="110" y="70" fill="#38BDF8" font-family="sans-serif" font-size="13" font-weight="600">RT / RW Aktif</text>
        <text x="24" y="94" fill="#64748B" font-family="sans-serif" font-size="11">Tersebar di 38 Rukun Tetangga</text>
      </g>

      <!-- Tile 3 -->
      <g transform="translate(690, 0)">
        <rect width="320" height="110" rx="14" fill="#131D33" stroke="#1E293B" stroke-width="1.5"/>
        <text x="24" y="34" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="0.05em">PERMOHONAN DOKUMEN</text>
        <text x="24" y="72" fill="#38BDF8" font-family="'DM Sans', sans-serif" font-size="28" font-weight="800">1,840</text>
        <text x="115" y="70" fill="#34D399" font-family="sans-serif" font-size="13" font-weight="600">98.4% Selesai</text>
        <text x="24" y="94" fill="#64748B" font-family="sans-serif" font-size="11">Rata-rata waktu proses 24 Jam</text>
      </g>

      <!-- Tile 4 -->
      <g transform="translate(1035, 0)">
        <rect width="305" height="110" rx="14" fill="#131D33" stroke="#1E293B" stroke-width="1.5"/>
        <text x="24" y="34" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="0.05em">STATUS INDEKS CANTIK</text>
        <text x="24" y="72" fill="#34D399" font-family="'DM Sans', sans-serif" font-size="28" font-weight="800">92.6 / 100</text>
        <text x="24" y="94" fill="#64748B" font-family="sans-serif" font-size="11">Predikat Sangat Mandiri (BPS)</text>
      </g>
    </g>

    <!-- MAIN CHART & MAP SECTION -->
    <g transform="translate(30, 280)">
      <!-- Left Chart: Demografi Kelompok Umur -->
      <rect width="780" height="420" rx="16" fill="#101827" stroke="#1E293B" stroke-width="1.5"/>
      <text x="30" y="42" fill="#F8FAFC" font-family="'DM Sans', sans-serif" font-size="16" font-weight="700">Piramida Struktur Usia &amp; Angkatan Kerja</text>
      <text x="30" y="64" fill="#64748B" font-family="sans-serif" font-size="12">Distribusi penduduk usia produktif (15-64 tahun) dan lansia</text>

      <!-- Horizontal Bar Visualization -->
      <g transform="translate(30, 95)">
        <!-- Bar 1 -->
        <text x="0" y="24" fill="#94A3B8" font-family="sans-serif" font-size="12">0 - 14 Tahun (Anak-anak)</text>
        <rect x="220" y="10" width="380" height="20" rx="5" fill="#1E293B"/>
        <rect x="220" y="10" width="280" height="20" rx="5" fill="#0284C7"/>
        <text x="515" y="25" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">3,840</text>

        <!-- Bar 2 -->
        <text x="0" y="64" fill="#94A3B8" font-family="sans-serif" font-size="12">15 - 24 Tahun (Pelajar/Muda)</text>
        <rect x="220" y="50" width="380" height="20" rx="5" fill="#1E293B"/>
        <rect x="220" y="50" width="340" height="20" rx="5" fill="#38BDF8"/>
        <text x="575" y="65" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">4,910</text>

        <!-- Bar 3 -->
        <text x="0" y="104" fill="#94A3B8" font-family="sans-serif" font-size="12">25 - 54 Tahun (Usia Produktif)</text>
        <rect x="220" y="90" width="380" height="20" rx="5" fill="#1E293B"/>
        <rect x="220" y="90" width="375" height="20" rx="5" fill="#60A5FA"/>
        <text x="610" y="105" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">7,220</text>

        <!-- Bar 4 -->
        <text x="0" y="144" fill="#94A3B8" font-family="sans-serif" font-size="12">55+ Tahun (Lansia)</text>
        <rect x="220" y="130" width="380" height="20" rx="5" fill="#1E293B"/>
        <rect x="220" y="130" width="190" height="20" rx="5" fill="#818CF8"/>
        <text x="425" y="145" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">2,522</text>
      </g>

      <!-- Trend Area Chart Simulation -->
      <path d="M 60 380 Q 200 310, 360 340 T 720 270 L 720 390 L 60 390 Z" fill="url(#kcAccentMesh)"/>
      <path d="M 60 380 Q 200 310, 360 340 T 720 270" stroke="#38BDF8" stroke-width="3" fill="none"/>
      <circle cx="360" cy="340" r="6" fill="#38BDF8" stroke="#0B1120" stroke-width="2"/>
      <circle cx="720" cy="270" r="6" fill="#38BDF8" stroke="#0B1120" stroke-width="2"/>

      <!-- Right Panel: Geospatial Mapping & Service Hub -->
      <g transform="translate(805, 0)">
        <rect width="535" height="420" rx="16" fill="#101827" stroke="#1E293B" stroke-width="1.5"/>
        <text x="30" y="42" fill="#F8FAFC" font-family="'DM Sans', sans-serif" font-size="16" font-weight="700">Pemetaan Sebaran Titik Bantuan Sosial &amp; RW</text>
        <text x="30" y="64" fill="#64748B" font-family="sans-serif" font-size="12">Visualisasi GIS spasial lokasi sebaran bantuan</text>

        <!-- Simulated Map Grid -->
        <g transform="translate(30, 90)">
          <rect width="475" height="240" rx="12" fill="#0B1220" stroke="#1E293B"/>
          <!-- Map streets -->
          <path d="M 0 50 Q 150 70, 300 40 T 475 80" stroke="#1E293B" stroke-width="6" fill="none"/>
          <path d="M 120 0 L 160 240" stroke="#1E293B" stroke-width="8" fill="none"/>
          <path d="M 320 0 L 300 240" stroke="#1E293B" stroke-width="6" fill="none"/>
          <path d="M 0 160 Q 240 180, 475 140" stroke="#1E293B" stroke-width="5" fill="none"/>

          <!-- Map Pin Points -->
          <circle cx="160" cy="110" r="14" fill="#0284C7" opacity="0.3"/>
          <circle cx="160" cy="110" r="7" fill="#38BDF8"/>

          <circle cx="310" cy="70" r="14" fill="#10B981" opacity="0.3"/>
          <circle cx="310" cy="70" r="7" fill="#34D399"/>

          <circle cx="380" cy="170" r="14" fill="#F59E0B" opacity="0.3"/>
          <circle cx="380" cy="170" r="7" fill="#FBBF24"/>

          <circle cx="80" cy="180" r="14" fill="#38BDF8" opacity="0.3"/>
          <circle cx="80" cy="180" r="7" fill="#38BDF8"/>
        </g>

        <!-- Legend -->
        <g transform="translate(30, 355)">
          <circle cx="10" cy="10" r="5" fill="#38BDF8"/>
          <text x="25" y="14" fill="#94A3B8" font-family="sans-serif" font-size="12">Posko Kelurahan</text>

          <circle cx="170" cy="10" r="5" fill="#34D399"/>
          <text x="185" y="14" fill="#94A3B8" font-family="sans-serif" font-size="12">Pusat Data BPS</text>

          <circle cx="330" cy="10" r="5" fill="#FBBF24"/>
          <text x="345" y="14" fill="#94A3B8" font-family="sans-serif" font-size="12">Distribusi Bansos</text>
        </g>
      </g>
    </g>
  </g>
</svg>
